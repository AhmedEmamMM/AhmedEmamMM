# Regenerates the profile images every day and publishes them to the "output" branch:
#   top-langs.svg            most used languages (scripts/top-langs.mjs)
#   github-snake.svg / -dark contribution snake (Platane/snk)
# The README links to them via raw.githubusercontent.com/AhmedEmamMM/AhmedEmamMM/output/...
#
# Languages count public repos by default. To include private repos, add a repository secret
# named LANGS_TOKEN (a fine-grained token with read-only "Metadata" access to all your repos).
name: Update profile images

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile-images
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Most used languages
        run: node scripts/top-langs.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.LANGS_TOKEN != '' && secrets.LANGS_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.LANGS_TOKEN != '' }}
          EXCLUDE_REPOS: AhmedEmamMM,skyline-survival

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update profile images
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
